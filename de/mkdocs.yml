# Project Information
site_name: Zusammen lernt man weniger allein!
site_url: https://lernos.org/de
site_author: Simon Dückert
site_description: lernOS ist eine Community und eine Sammlung von Lernpfaden rund um das selbstorganisierte, lebenslange Lernen.

# Repository
repo_name: 'cogneon/lernos'
repo_url: 'https://github.com/cogneon/lernos'

# Copyright
copyright: lernOS wird gesponsert von <a href="https://cogneon.de">Cogneon</a> (<a href="https://cogneon.de/impressum">Impressum</a>) und den <a href="https://cogneon.de/lernos">lernOS Supportern</a> 🧡
# copyright: cogneon.de/impressum

# Folder
docs_dir: src
site_dir: ../docs/de

# Configuration
theme:
    name: material
    custom_dir: src/overrides
    palette:
        scheme: default
        primary: custom
        accent: custom
    language: de
    logo: images/lernos-logo.svg
    favicon: images/lernos-suri.png
    icon:
      repo: fontawesome/brands/github
    features:
      - search.share

extra_css:
  - stylesheets/extra.css

# Additional configuration
extra:
    social:
        - icon: fontawesome/brands/linkedin
          link: 'https://www.linkedin.com/showcase/lern-os'
        - icon: fontawesome/brands/mastodon
          link: 'https://colearn.social/@lernos'
        - icon: fontawesome/brands/discord
          link: 'https://discord.gg/3d6zEnt'
        - icon: fontawesome/brands/github
          link: 'https://github.com/cogneon'
    giscus: true
#    alternate:
#      - name: English
#        link: https://lernos.org/en
#        lang: en
    generator: false

# Extensions
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
          
# Plugins
plugins:
  - search
  - blog:
      blog_dir: blog
  - rss:
      match_path:   posts/.* 
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
      length: 1000
#  - minify:
#      minify_html: true

# Navigation
nav:
    - Startseite: index.md
    - Über lernOS: about.md
    - Events: events.md
    - Leitfäden: guides.md
    - Learning Circles: learning-circles.md
    - Mitmachen: contribute.md
    - Leitfaden erstellen: create-guide.md
    - Für Organisationen: for-organizations.md
    - Publikationen: publications.md
    - Blog: blog/index.md
    - FAQ: faq.md